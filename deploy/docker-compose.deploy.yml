# Stack server (staging/produksi) pada satu server: Caddy + web + api + worker + redis.
# File ini dimiliki repo backend; image web berasal dari repo frontend.
# PostgreSQL diasumsikan terkelola/terpisah (DATABASE_URL); sesuaikan dengan keputusan hosting (Fase 0).
# Dijalankan oleh deploy.sh: API_IMAGE, WEB_IMAGE, API_TAG, WEB_TAG dibaca dari lingkungan / berkas .tags.
services:
  caddy:
    image: caddy:2
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}:${WEB_TAG}
    restart: unless-stopped

  api:
    image: ${API_IMAGE}:${API_TAG}
    env_file: .env
    command: ['node', 'dist/main.js']
    depends_on: [redis]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    image: ${API_IMAGE}:${API_TAG}
    env_file: .env
    command: ['node', 'dist/worker.js']
    depends_on: [redis]
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE}:${API_TAG}
    env_file: .env
    command: ['node', 'dist/migrate.js']
    profiles: ['migrate']

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis_data:/data]
    restart: unless-stopped

volumes:
  caddy_data:
  redis_data:
